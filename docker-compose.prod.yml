services:
  db:
    image: postgres:16-alpine
    container_name: trackify-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trackify}
      POSTGRES_USER: ${POSTGRES_USER:-trackify}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - trackify-db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "${POSTGRES_USER:-trackify}" -d "${POSTGRES_DB:-trackify}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build: ./backend
    container_name: trackify-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-trackify}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-trackify}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      SPRING_SESSION_STORE_TYPE: jdbc
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost}
      SERVER_SERVLET_SESSION_COOKIE_SECURE: ${SERVER_SERVLET_SESSION_COOKIE_SECURE:-false}
      SERVER_SERVLET_SESSION_COOKIE_SAME_SITE: ${SERVER_SERVLET_SESSION_COOKIE_SAME_SITE:-lax}
      AUTH_BOOTSTRAP_ADMIN_LOGIN: ${AUTH_BOOTSTRAP_ADMIN_LOGIN:-}
      AUTH_BOOTSTRAP_ADMIN_EMAIL: ${AUTH_BOOTSTRAP_ADMIN_EMAIL:-}
      AUTH_BOOTSTRAP_ADMIN_PASSWORD: ${AUTH_BOOTSTRAP_ADMIN_PASSWORD:-}

  frontend:
    build: ./frontend
    container_name: trackify-frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  trackify-db-data:
    name: trackify-db-data
